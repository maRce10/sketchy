on:
  push:
    branches: [main, master]
  workflow_dispatch:

name: Render and deploy to GitHub Pages

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; let an in-progress run finish rather
# than cancelling it mid-deploy.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # The site uses 'execute: freeze: true' (see scripts/_quarto.yml):
      # pages rendered locally are NOT re-run here, their results are replayed
      # from the committed scripts/_freeze/ folder. Pages that have never been
      # rendered locally are run here, which requires their packages (and data).
      #
      # With renv (project created with 'renv = TRUE'), the packages recorded
      # in renv.lock are installed, so pages can be run here.
      - name: Install project packages from renv.lock
        if: hashFiles('renv.lock') != ''
        uses: r-lib/actions/setup-renv@v2

      # Without renv only the packages needed to replay frozen pages are
      # installed: render the site locally first ('quarto render' within
      # 'scripts/') and commit scripts/_freeze/ every time the analyses change.
      - name: Install R packages needed to assemble the (frozen) site
        if: hashFiles('renv.lock') == ''
        run: install.packages(c("knitr", "rmarkdown"))
        shell: Rscript {0}

      - name: Render site
        working-directory: scripts
        run: quarto render

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: scripts/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
